name: Refresh localization admin view

on:
  push:
    branches:
      - 'issue#126/localization-admin-view'

permissions:
  contents: write

jobs:
  refresh:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 'issue#126/localization-admin-view'
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.13'
      - run: bun install
      - run: bun run format
      - run: bun run lint:fix
      - run: bun run build
      - run: bun run knip
      - run: bun test
      - name: Commit lockfile and formatting
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add bun.lock package.json tsconfig.json src test README.md .changeset
          git commit -m 'Validate localization admin view'
          git push origin HEAD:'issue#126/localization-admin-view'
